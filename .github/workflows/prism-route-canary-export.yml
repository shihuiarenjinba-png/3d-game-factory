name: Prism Route 3D — real Godot 4.3 Factory export

on:
  push:
    branches:
      - codex/3d-canary-prism-route-20261028
      - codex/prism-route-trap-tension-20261029
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-canary-export:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exact single-product manifest and source structure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('products/prism-route-3d')
          m=json.loads((p/'product-manifest.json').read_text())
          assert (m['slug'],m['lane'],m['registration_type'],m['second_3d_product_allowed'])==('prism-route-3d','GAME_3D','MSIX_OR_PWA_GAME',False)
          assert m['store_identity'] is None and m['packaging_strategy']=='GODOT_WINDOWS_EXE_PCK_MAKEAPPX_MSIX'
          # Revision reuses a real, previously returned Partner Center product,
          # but the old package/source SHA must NEVER authenticate the new build.
          identity=json.loads((p/'store/approved-identity.json').read_text())
          old='15fdcb52e46e35e6de8e87c55af99719c21e09b9'
          assert identity['source_sha']==old and identity['verified_source_sha']==old
          assert identity['store_id'] and identity['package_family_name'] and identity['package_sid']
          assert identity['package_version_gate']=='HOLD'
          assert identity['signature_status']=='PRE_IDENTITY_EXE_NOT_MSIX'
          assert os.environ['GITHUB_REF_NAME']=='codex/prism-route-trap-tension-20261029'
          assert os.environ['GITHUB_SHA']!=old
          for name in ['project.godot','export_presets.cfg','scenes/main.tscn','scripts/main.gd','scripts/game_logic.gd','scripts/save_store.gd','tests/test_smoke.gd']:
              assert (p/name).is_file(),name
          print('PASS: single revision source; old Partner Center Identity is provenance only, new package HOLD')
          PY
      - name: Install official Godot 4.3 and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 3 'https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip' -o /tmp/godot.zip
          curl -fL --retry 3 --retry-delay 3 'https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz' -o /tmp/templates.tpz
          mkdir -p /tmp/godot-bin /tmp/godot-tpl "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          unzip -q /tmp/templates.tpz -d /tmp/godot-tpl
          cp -a /tmp/godot-tpl/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          chmod +x /tmp/godot-bin/Godot_v4.3-stable_linux.x86_64
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/windows_release_x86_64.exe"
      - name: Real Godot import, deterministic gameplay regression, main scene launch
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/godot-bin/Godot_v4.3-stable_linux.x86_64
          PROJECT="$GITHUB_WORKSPACE/products/prism-route-3d"
          "$GODOT" --headless --editor --path "$PROJECT" --import
          "$GODOT" --headless --path "$PROJECT" --script res://tests/test_smoke.gd | tee /tmp/prism-smoke.log
          grep -q 'PASS: Prism Route 3D gameplay' /tmp/prism-smoke.log
      - name: Software-rendered 1024x768 scene smoke (no dummy renderer)
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/godot-bin/Godot_v4.3-stable_linux.x86_64
          PROJECT="$GITHUB_WORKSPACE/products/prism-route-3d"
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi
          # Headless dummy-renderer scene launches emit mesh-storage errors even
          # when logic tests pass. Use Mesa software OpenGL under virtual X11
          # to exercise actual MeshInstance3D and CanvasLayer construction.
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "$GODOT" \\
            --rendering-method gl_compatibility --resolution 1024x768 \\
            --path "$PROJECT" --quit-after 60 2>&1 | tee /tmp/prism-render-smoke.log
          if grep -Eq '(^|[[:space:]])(SCRIPT )?ERROR:' /tmp/prism-render-smoke.log; then
            echo 'HOLD: rendered scene reported Godot errors' >&2
            exit 1
          fi
          echo 'PASS: 1024x768 Mesa software-rendered scene started without Godot ERROR diagnostics'
      - name: Real Godot Windows x64 EXE/PCK export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          /tmp/godot-bin/Godot_v4.3-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/products/prism-route-3d" --export-release 'Windows Desktop' "$GITHUB_WORKSPACE/export/candidate.exe"
      - name: Validate actual export bytes and record strict Factory provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out=Path('export')
          exe,pck=out/'candidate.exe',out/'candidate.pck'
          if not exe.is_file() or exe.stat().st_size<1024 or exe.open('rb').read(2)!=b'MZ':
              raise SystemExit('HOLD: real Godot Windows EXE missing/invalid')
          if not pck.is_file() or pck.stat().st_size<4 or pck.open('rb').read(4)!=b'GDPC':
              raise SystemExit('HOLD: real Godot PCK missing/invalid')
          sha=os.environ['GITHUB_SHA']
          branch=os.environ['GITHUB_REF_NAME']
          if branch!='codex/prism-route-trap-tension-20261029' or len(sha)!=40:
              raise SystemExit('HOLD: unexpected source branch/SHA')
          record=dict(schema_version=1,request_id='3d-prism-route-3d-'+sha[:12],
            product_type='GAME_3D',source_repository=os.environ['GITHUB_REPOSITORY'],
            source_branch=branch,source_sha=sha,factory_build_head=sha,
            slug='prism-route-3d',exe_path='candidate.exe',
            exe_sha256=hashlib.sha256(exe.read_bytes()).hexdigest(),exe_size_bytes=exe.stat().st_size,
            pck_path='candidate.pck',pck_sha256=hashlib.sha256(pck.read_bytes()).hexdigest(),
            pck_size_bytes=pck.stat().st_size)
          (out/'export-evidence.json').write_text(json.dumps(record,sort_keys=True,indent=2)+'\n')
          print(json.dumps(record,sort_keys=True,indent=2))
          PY
      - name: Record independent old-Identity reuse versus new-revision binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('products/prism-route-3d/store/approved-identity.json')
          identity=json.loads(p.read_text())
          export=json.loads(Path('export/export-evidence.json').read_text())
          old='15fdcb52e46e35e6de8e87c55af99719c21e09b9'
          assert export['source_sha']==os.environ['GITHUB_SHA']
          assert export['request_id']=='3d-prism-route-3d-'+os.environ['GITHUB_SHA'][:12]
          assert export['source_sha']!=old
          assert identity['source_sha']==old and identity['verified_source_sha']==old
          receipt={
            'schema_version':1,'product':'Prism Route 3D','slug':'prism-route-3d',
            'old_identity_provenance_sha':old,
            'new_revision_source_sha':export['source_sha'],
            'new_revision_request_id':export['request_id'],
            'partner_center_product_reuse':True,
            'store_id':identity['store_id'],
            'identity_rebinding_status':'PENDING_INDEPENDENT_VERIFICATION',
            'approved_package_version':None,
            'signed_msix_verified':False,
            'windows_all_auto_intake_verified':False,
            'product_e2e':'HOLD'
          }
          Path('export/revision-identity-reuse.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('PASS: separate old Identity provenance from new revision; package remains HOLD')
          PY
      - name: Publish revision binding receipt separately from Factory byte contract
        uses: actions/upload-artifact@v4
        with:
          name: prism-route-3d-revision-identity-reuse
          path: export/revision-identity-reuse.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish exact three-file Factory export evidence for Provisioner
        uses: actions/upload-artifact@v4
        with:
          name: godot-3d-factory-export-evidence
          path: |
            export/candidate.exe
            export/candidate.pck
            export/export-evidence.json
          if-no-files-found: error
          retention-days: 7
