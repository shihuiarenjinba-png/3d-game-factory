name: Godot 3D candidate quality checks (MCP orchestrated)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/3d-factory-bootstrap-20261026
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify five-day cooldown and candidate controls
        run: |
          python -m py_compile factory3d.py
          python -m unittest discover -s tests -v
      - name: Explain 3D cadence
        run: |
          echo "ChatGPT 45-minute-slot task checks the 120-hour 3D cooldown."
          echo "No model or API is started by GitHub Actions."
          echo "3D MSIX, real Windows 3D QA, and Store submission are not claimed."
