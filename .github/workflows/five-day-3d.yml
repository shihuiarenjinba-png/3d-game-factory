name: Godot 3D candidate quality checks (MCP orchestrated)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # Test the commit that triggered this run, never an older work branch.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify five-day cooldown and candidate controls
        run: |
          python -m py_compile factory3d.py
          python -m unittest discover -s tests -v
      - name: Explain 3D cadence
        run: |
          echo "The ChatGPT 3D improvement slots do not generate a new game every 30 minutes."
          echo "A candidate is accepted only after the 120-hour gate."
          echo "No model or paid API is started by GitHub Actions."
          echo "3D MSIX, real Windows GPU QA, and Store submission are not claimed."
